
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Activando VIP...</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
  }
</style>
</head>
<body>

<h2>Activando tu VIP...</h2>
<p>Un momento por favor...</p>

<script>
const backend = "https://backend-premium-production-29b1.up.railway.app";

// Obtener el "code" de Patreon
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

if (!code) {
    document.body.innerHTML = "<h3>Error: falta el código de Patreon.</h3>";
} else {

    // Enviar el code al backend
    fetch(`${backend}/callback?code=${code}`, {
        method: "GET",
        credentials: "include"
    })
    .then(() => {
        // Redirigir a VIP.html
        window.location.href = "vip.html";
    })
    .catch(err => {
        document.body.innerHTML = "<h3>Error activando VIP.</h3>";
        console.error(err);
    });
}
</script>

</body>
</html>
